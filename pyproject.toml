[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gemini-accounts"
version = "0.1.0"
description = "Manual account selection for the official Gemini CLI"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "IOANNIS SIOKOS" }]

[project.scripts]
gemini-accounts = "gemini_accounts.cli:main"
gemini = "gemini_accounts.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["gemini_accounts"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
